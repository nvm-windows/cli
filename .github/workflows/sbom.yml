name: SBOM

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'nvm/**'
      - 'common/**'
      - '.compliance/**'
      - 'go.work'

jobs:
  sbom:
    name: Build And Publish SBOM
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOBIN: ${{ github.workspace }}\go-bin
      QGO_VERSION: 1.2.8
      SYFT_VERSION: 1.42.3
      GRANT_VERSION: 0.6.4

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: nvm/go.mod

      - name: Cache Tool Binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.GOBIN }}
          key: tools-${{ runner.os }}-${{ runner.arch }}-qgo-${{ env.QGO_VERSION }}-syft-${{ env.SYFT_VERSION }}-grant-${{ env.GRANT_VERSION }}

      - name: Install qgo If Needed
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GOBIN\qgo.exe")) {
            go install github.com/quikdev/go/cmd/qgo@v${{ env.QGO_VERSION }}
          } else {
            Write-Host "using cached qgo binary"
          }

      - name: Install syft If Needed
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GOBIN\syft.exe")) {
            go install github.com/anchore/syft/cmd/syft@v${{ env.SYFT_VERSION }}
          } else {
            Write-Host "using cached syft binary"
          }

      - name: Install grant If Needed
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GOBIN\grant.exe")) {
            go install github.com/anchore/grant/cmd/grant@v${{ env.GRANT_VERSION }}
          } else {
            Write-Host "using cached grant binary"
          }

      - name: Add Tool Directory To PATH
        shell: pwsh
        run: |
          echo "${env:GOBIN}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure jq Is Installed
        shell: pwsh
        run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            choco install jq -y --no-progress
          }
          jq --version

      - name: Build nvm Binary
        shell: pwsh
        working-directory: nvm
        run: |
          qgo build --no-cache

      - name: Generate SBOM
        shell: pwsh
        working-directory: nvm
        run: |
          syft ..\bin\nvm.exe --enrich golang -o cyclonedx-json > ..\.compliance\sbom.json

      - name: Patch And Simplify SBOM
        shell: pwsh
        working-directory: .compliance
        run: |
          .\patch-sbom.bat

      - name: Generate Grant License Inventory
        shell: pwsh
        run: |
          grant list .\.compliance\sbom-full.json -c .\.compliance\grant.yml -o json -f .\.compliance\grant-licenses.json

      - name: Generate Grant Compliance Report
        shell: pwsh
        run: |
          grant check .\.compliance\sbom-full.json -c .\.compliance\grant.yml --dry-run -o json -f .\.compliance\grant-check.json

      - name: Upload Full SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-full
          path: .compliance/sbom-full.json
          if-no-files-found: error

      - name: Upload Simple SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-simple
          path: .compliance/sbom-simple.json
          if-no-files-found: error

      - name: Upload Grant License Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grant-licenses
          path: .compliance/grant-licenses.json
          if-no-files-found: error

      - name: Upload Grant Check Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grant-check
          path: .compliance/grant-check.json
          if-no-files-found: error
