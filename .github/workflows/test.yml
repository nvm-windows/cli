name: Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Identify Changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_changes: ${{ steps.compute.outputs.has_changes }}
      matrix: ${{ steps.compute.outputs.matrix }}
      github_changed: ${{ steps.compute.outputs.github_changed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Path Changes
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nvm:
              - 'src/**'
              - '.github/**'
            github:
              - '.github/**'
              - 'LICENSE'
              - 'src/manifest.json'
              - 'src/winres/**'

      - name: Build App Matrix
        id: compute
        shell: bash
        run: |
          apps=()
          github_changed=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            apps+=("nvm")
          else
            if [[ "${{ steps.changes.outputs.nvm }}" == "true" ]]; then
              apps+=("nvm")
            fi
            if [[ "${{ steps.changes.outputs.github }}" == "true" ]]; then
              github_changed=true
            fi
          fi

          echo "github_changed=$github_changed" >> "$GITHUB_OUTPUT"

          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"app":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix_json=$(printf '%s\n' "${apps[@]}" | jq -R . | jq -sc '{app: .}')
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  github-guard:
    name: Guard Sensitive Changes
    needs: detect
    if: ${{ github.event_name == 'pull_request' && needs.detect.outputs.github_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Same-Repo Or Core Team For Sensitive Changes
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          TEAM_SLUG: core
          ACTOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN cannot read org teams. Private org membership also
          # makes author_association=CONTRIBUTOR for org owners. Same-repo PRs
          # already require write access to push the branch.
          if [[ "${HEAD_REPO}" == "${BASE_REPO}" ]]; then
            echo "${ACTOR} allowed: same-repo PR (${HEAD_REPO})."
            exit 0
          fi

          endpoint="https://api.github.com/orgs/${ORG}/teams/${TEAM_SLUG}/memberships/${ACTOR}"
          status=$(curl -sS -o /tmp/team_check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$endpoint")

          if [[ "$status" == "200" ]]; then
            echo "${ACTOR} is a member of ${ORG}/${TEAM_SLUG}."
            exit 0
          fi

          echo "::error::Changes to .github/** and LICENSE from forks need ${ORG}/${TEAM_SLUG} membership (or an ORG_READ_TOKEN secret)."
          echo "actor=${ACTOR} head=${HEAD_REPO} base=${BASE_REPO} team_check_http=${status}"
          cat /tmp/team_check.json || true
          exit 1

  test:
    name: test (${{ matrix.app }})
    needs: detect
    if: ${{ needs.detect.outputs.has_changes == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 3
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    env:
      GOBIN: ${{ github.workspace }}\go-bin
      QGO_VERSION: 1.2.8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Checkout common modules
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "common"
          if (-not (Test-Path (Join-Path $dest "settings\go.mod"))) {
            git clone --depth 1 https://github.com/nvm-windows/common.git $dest
          }

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Cache qgo binary
        uses: actions/cache@v5
        with:
          path: ${{ env.GOBIN }}
          key: qgo-${{ runner.os }}-${{ runner.arch }}-${{ env.QGO_VERSION }}

      - name: Install qgo if not cached
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GOBIN\qgo.exe")) {
            go install github.com/quikdev/go/cmd/qgo@v${{ env.QGO_VERSION }}
          } else {
            Write-Host "using cached qgo binary"
          }

      - name: Add qgo to PATH
        shell: pwsh
        run: |
          echo "${env:GOBIN}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run qgo test
        shell: pwsh
        working-directory: src
        run: |
          qgo test

      - name: Run go test (cli/src)
        shell: pwsh
        working-directory: src
        run: |
          go test -p 1 -timeout 3m ./...

  no-op:
    name: Skip App Tests
    needs: detect
    if: ${{ needs.detect.outputs.has_changes != 'true' }}
    runs-on: ubuntu-slim
    steps:
      - name: Skip
        run: |
          echo "No src/ or .github/ changes; app tests skipped."
          echo "github-guard still runs when .github/** or LICENSE change."
